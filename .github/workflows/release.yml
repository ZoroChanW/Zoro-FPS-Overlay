name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "zoro-fps-overlay-v$version-windows-x64"
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/zoro-fps-overlay.exe $name/
          Copy-Item PresentMon.exe $name/
          Copy-Item README.md, README-fa.md, LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            Unzip and run `zoro-fps-overlay.exe`. Keep `PresentMon.exe` in the same folder.
            Windows 10/11 x64.
